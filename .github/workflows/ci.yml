name: CI

on:
  pull_request:
  push:
    branches: [master]

# Deliberately does NOT check out LFS content. The repo carries ~2.4 GB of
# LFS media and GitHub meters LFS bandwidth, so pulling it on every push
# would be slow and billable. None of the checks below need image or audio
# bytes: an LFS pointer is still a file on disk, so the "does this asset
# exist" guards work exactly the same, and that is the failure that has
# actually bitten (a require() pointing at a file nobody committed took the
# whole web build down, unnoticed, because nothing ran on PRs).

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          # Expo SDK 57 requires Node 22.13+
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test
