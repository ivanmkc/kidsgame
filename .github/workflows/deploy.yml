name: Deploy

# Ships master to https://ivanmkc.github.io/kidsgame/ through tools/ship.sh
# and all its content gates. A gate failure fails the run and leaves the live
# site on the last good build.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Merges land several times an hour; only the newest master needs to ship.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The run holds the media, the build and a clone of gh-pages (~4 GB)
      # at once; drop preinstalled toolchains the build doesn't use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      # The build needs the ~2.4 GB of LFS media, and GitHub meters LFS
      # bandwidth. Keep .git/lfs in the Actions cache, so each run downloads
      # only the objects added since the last cached run.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-ids
      - name: Restore LFS cache
        id: lfs-cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-
      - name: Pull LFS media
        run: git lfs pull
      - name: Save LFS cache
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
      - name: Drop the LFS store (the media is checked out now)
        run: rm -rf .git/lfs/objects

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gate dependencies
        run: |
          pip install numpy pillow opencv-python-headless
          command -v ffprobe || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }

      - name: Ship
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # gh-pages clones and pushes with origin's URL.
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          rm -f .lfs-ids
          bash tools/ship.sh
